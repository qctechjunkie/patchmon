# ==============================================================================
# PatchMon Docker Compose - Production
# ==============================================================================
# Before starting, copy env.example to .env and fill in your values:
#
#   cp env.example .env
#
# Then start PatchMon:
#
#   docker compose up -d
#
# See the PatchMon documentation for full configuration details.
# ==============================================================================

name: patchmon

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Simple Redis configuration - no memory limits to prevent OOM errors
    # If you need memory limits, set maxmemory-policy to 'allkeys-lru' instead of 'noeviction'
    # to allow eviction rather than rejecting commands
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - patchmon-internal
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "-a",
          "${REDIS_PASSWORD}",
          "ping",
        ]
      interval: 3s
      timeout: 5s
      retries: 7
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/patchmon/patchmon-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Internal Docker wiring - do not change
      DATABASE_URL: postgresql://patchmon_user:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-pi2-postgres}:5432/patchmon_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      ASSETS_DIR: /app/assets
    volumes:
      - agent_files:/app/agents
      - branding_assets:/app/assets
    networks:
      - patchmon-internal
      - pi2-postgres-network
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/patchmon/patchmon-frontend:latest
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - branding_assets:/usr/share/nginx/html/assets
    networks:
      - patchmon-internal
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
  agent_files:
  branding_assets:

networks:
  patchmon-internal:
    driver: bridge
  pi2-postgres-network:
    name: ${POSTGRES_NETWORK_NAME:-pi2-postgres-network}
    external: true
